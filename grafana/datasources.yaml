apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus.monitoring.svc.cluster.local:9090
    isDefault: true
    jsonData:
      # Both open the exemplar's trace. In Explore, Grafana leaves the query type
      # empty, so pick TraceID there; the second link opens the Jaeger UI directly
      # (needs the port-forward from the README). $$ keeps Grafana's provisioning
      # from treating ${__value.raw} as an environment variable.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger
        - name: trace_id
          url: http://localhost:16686/trace/$${__value.raw}
          urlDisplayLabel: Open in Jaeger UI
  - name: Jaeger
    uid: jaeger
    type: jaeger
    url: http://jaeger-otel.jaeger.svc.cluster.local:16686
