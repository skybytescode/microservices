apiVersion: v1
kind: Service
metadata:
  name: order
  labels:
    service: order
spec:
  selector:
    service: order
  ports:
    - name: grpc
      port: 8080
      protocol: TCP
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  labels:
    service: order
spec:
  replicas: 1
  selector:
    matchLabels:
      service: order
  template:
    metadata:
      labels:
        service: order
      annotations:
        prometheus.io/scrape: "true"
    spec:
      initContainers:
      # Wait until MySQL answers, not just until its DNS name exists. mysqladmin
      # ping succeeds once the server is up, even without credentials.
      - name: mysql-check
        image: mysql:8
        command: ['sh', '-c', 'until mysqladmin ping -h mysql --silent; do echo waiting for mysql; sleep 2; done']
      containers:
      - name: order
        image: order
        env:
          - name: APPLICATION_PORT
            value: "8080"
          - name: ENV
            value: "prod"
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mysql
                key: password
          - name: DATA_SOURCE_URL
            value: "root:$(DB_PASSWORD)@tcp(mysql:3306)/orders?charset=utf8mb4&parseTime=True&loc=Local"
          - name: PAYMENT_SERVICE_URL
            value: "payment:8081"
          - name: SHIPPING_SERVICE_URL
            value: "shipping:8082"
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://jaeger-otel.jaeger.svc.cluster.local:4318"
          - name: METRICS_PORT
            value: "2112"
        ports:
          - containerPort: 8080
          - name: metrics
            containerPort: 2112
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: GRPC
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: selfsigned-issuer
  name: order
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /Order
            pathType: Prefix
            backend:
              service:
                name: order
                port:
                  number: 8080
  tls:
    - hosts:
        - ingress.local
      secretName: order-tls
