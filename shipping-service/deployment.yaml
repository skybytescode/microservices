apiVersion: v1
kind: Service
metadata:
  name: shipping
  labels:
    service: shipping
spec:
  clusterIP: None
  selector:
    service: shipping
  ports:
    - name: grpc
      port: 8082
      protocol: TCP
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  labels:
    service: shipping
spec:
  replicas: 1
  selector:
    matchLabels:
      service: shipping
  template:
    metadata:
      labels:
        service: shipping
      annotations:
        prometheus.io/scrape: "true"
    spec:
      initContainers:
      # Wait until MySQL answers, not just until its DNS name exists. mysqladmin
      # ping succeeds once the server is up, even without credentials.
      - name: mysql-check
        image: mysql:8
        command: ['sh', '-c', 'until mysqladmin ping -h mysql --silent; do echo waiting for mysql; sleep 2; done']
      containers:
      - name: shipping
        image: shipping
        env:
          - name: APPLICATION_PORT
            value: "8082"
          - name: ENV
            value: "prod"
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mysql
                key: password
          - name: DATA_SOURCE_URL
            value: "root:$(DB_PASSWORD)@tcp(mysql:3306)/shippings?charset=utf8mb4&parseTime=True&loc=Local"
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://jaeger-otel.jaeger.svc.cluster.local:4318"
          - name: METRICS_PORT
            value: "2112"
        ports:
          - name: metrics
            containerPort: 2112
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: GRPC
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: selfsigned-issuer
  name: shipping
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /Shipping
            pathType: Prefix
            backend:
              service:
                name: shipping
                port:
                  number: 8082
  tls:
    - hosts:
        - ingress.local
