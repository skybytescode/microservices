kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: microservices
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"          # ingress-nginx's kind manifest runs only on nodes with this label
    extraPortMappings:               # can only be set at creation time
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"   # localhost only, not reachable from your network
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
